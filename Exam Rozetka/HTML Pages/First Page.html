<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../SASS/css/First Page.css">

</head>

<body>
    <div class="dark-layout"></div>
    <div class="top-banner">
        <img src="" alt="">
    </div>
    <header>
        <div class="header-div">
            <div class="left-part d-flex align-items-center">
                <button>
                    <img src="../Exam Images/Header/Menu white.png" alt="Menu">
                </button>
                <div class="d-flex h-100 gap-2" title="Інтернет магазин Rozetka.ua - №1">
                    <a class="rz-symbols ms-1" href="#"><img src="../Exam Images/Header/Rozetka logo better.png"
                            alt="Rozetka logo"></a>
                    <a class="rz-symbols" href="#"><img class="rz-text"
                            src="../Exam Images/Header/Rozetka text the best.png" alt="Rozetka text"></a>
                </div>
                <button class="Catalog rounded-3">
                    <img src="../Exam Images/Header/Catalog white.png" alt="Каталог">
                    <p class="m-0 text-white">Каталог</p>
                </button>
            </div>

            <form class="rounded" action="">
                <img src="../Exam Images/Header/Loop.png" alt="Loop">
                <input type="text" placeholder="Я шукаю...">
                <button class="bg-transparent">
                    <img src="../Exam Images/Header/Microphone.png" alt="Microphone">
                </button>
                <button class="search-but rounded-3 text-white">
                    <p class="m-0">Знайти</p>
                </button>
            </form>

            <div class="right-part d-flex align-items-center">
                <div class="header-tools d-flex justify-content-center align-items-center">
                    <a href="#" title="Замовлення"><img src="../Exam Images/Header/Orders white.png" alt="Orders"></a>
                    <a href="#"><img src="../Exam Images/Header/Bell.png" alt="Bell"></a>
                    <a href="#" title="Списки порівнянь"><img src="../Exam Images/Header/Весы белые.png" alt="Весы"></a>
                    <button>
                        <img src="../Exam Images/Header/Shopping cart.png" alt="Cart">
                    </button>
                </div>
            </div>
        </div>
    </header>
    <div class="main-content">
        <div class="d-flex px-4">
            <aside>
                <div class="cards">
                    <div class="card">
                        <img src="../Exam Images/First Page/Aside/Rozetka Card.png" alt="Card">
                        <div>
                            <p class="m-0 fw-bold">Картка Rozetka</p>
                            <p class="m-0">Персональні знижки та бонуси</p>
                        </div>
                    </div>
                    <div class="card">
                        <img src="../Exam Images/First Page/Aside/Smart.png" alt="Smart-subscribe">
                        <div>
                            <p class="m-0 fw-bold">Підписка Smart</p>
                            <p class="m-0">Безкоштовна доставка з Rozetka + Prom за 50 ₴/міс</p>
                        </div>
                    </div>
                </div>
            </aside>
            <main>

            </main>
        </div>
        <section></section>
    </div>
    <footer>

    </footer>
</body>

</html>
