<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 from Dz 12</title>
    <link rel="stylesheet" href="Task 2.css">
</head>

<body>
    <div class="inputs">
        <h2>Inputs</h2>
        <div class="row-div">
            <input type="text" class="input-default" id="input-default" placeholder="Enter some text">
            <input type="text" class="input-valid" id="input-valid" value="valid text">
            <input type="text" class="input-invalid" id="input-invalid" value="invalid text">
        </div>
    </div>
    <div class="Check-boxes">
        <h2>Check boxes</h2>
        <div class="row-div">
            <label class="checkbox-item">
                <input type="checkbox" class="checkbox-element" id="checkbox-element">
                <span class="checkbox-switch"></span>
                Subscribe
            </label>
            <label class="checkbox-item">
                <input type="checkbox" class="checkbox-element" id="checkbox-element">
                <span class="checkbox-switch"></span>
                Subscribe
            </label>
        </div>
    </div>
    <div class="Radio-buttons">
        <h2>Radio buttons</h2>
        <div class="row-div">
            <p>Gender:</p>
            <fieldset>
                <label class="radio-item">
                    <input type="radio" name="radio-element" class="radio-element">
                    <span class="radio-switch"></span>
                    Male
                </label>
                <label class="radio-item">
                    <input type="radio" name="radio-element" class="radio-element">
                    <span class="radio-switch"></span>
                    Female
                </label>
            </fieldset>
        </div>
    </div>
    <div class="Buttons">
        <h2>Buttons</h2>
        <div class="row-div">
            <div class="button-item button-active"><p>Active</p></div>
            <div class="button-item button-active-hover"><p>Hover</p></div>
            <div class="button-item button-danger"><p>Danger</p></div>
            <div class="button-item button-danger-hover"><p>Hover</p></div>
            <div class="button-item button-disabled"><p>Disabled</p></div>
            <div class="round-button round-button-plus"><img src="../images/plus.png" alt="plus"></div>
            <div class="round-button round-button-minus"><img src="../images/minus.png" alt="minus"></div>
        </div>
    </div>
    <div class="Text">
        <h2>Text area</h2>
        <textarea name="text-area" id="text-area" placeholder="Enter some text"></textarea>
    </div>
</body>

</html>
