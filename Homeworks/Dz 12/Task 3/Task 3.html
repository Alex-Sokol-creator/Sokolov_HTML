<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 from Dz 12</title>
    <style>
        body {
            background-color: whitesmoke;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        .registration{
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.644);
            max-width: 1100px;
            padding: 25px 35px;
        }

        .registration h2 {
            font-weight: 400;
        }

        .registration-form {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 10px;
        }

        .registration-form div:not(.passwords) {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 20px;
        }

        .registration-form input,
        .personal-details input {
            width: 100%;
            border: none;
            border-bottom: 2px solid lightgray;
            font-size: 15px;
            padding: 5px 15px;
            background-color: whitesmoke;
        }

        .registration-form input:focus,
        .personal-details input:focus {
            outline: none;
        }

        .personal-details input {
            padding: 13px 15px;
        }

        .registration-form img {
            width: 40px;
        }

        .passwords {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .form {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 45px;
        }

        .details-items {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 15px;
            row-gap: 3px;
        }

        .first-name {
            grid-row: 1;
            grid-column: 1;
        }

        .last-name {
            grid-row: 1;
            grid-column: 2;
        }

        .Gender {
            grid-row: 2;
            grid-column: 1;
        }

        .date {
            grid-row: 2;
            grid-column: 2;
        }

        .checkboxes {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 20px;
            margin: 40px 0;
        }

        .button{
            background-color: #008787;
            color: whitesmoke;
            width: 100px;
            padding: 10px 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="registration">
        <div class="form">
            <div class="registration-form">
                <h2>Registration form</h2>
                <div>
                    <img src="../images/account.png" alt="account">
                    <input type="text" class="username" placeholder="Username">
                </div>
                <div>
                    <img src="../../Dz 10/Images/mail.png" alt="mail">
                    <input type="text" class="mail" placeholder="Email address">
                </div>
                <div>
                    <img src="../images/lock.png" alt="lock">
                    <div class="passwords">
                        <input type="password" class="password" placeholder="Password">
                        <input type="password" class="password-confirm" placeholder="Confirm password">
                    </div>
                </div>
            </div>
            <div class="personal-details">
                <h2>Personal details</h2>
                <div class="details-items">
                    <input type="text" class="first-name" placeholder="First name">
                    <input type="text" class="last-name" placeholder="Last name">
                    <input type="text" class="Gender" placeholder="Gender" list="genders">
                    <datalist id="genders">
                        <option>Male</option>
                        <option>Female</option>
                    </datalist>
                    <input type="date" class="date">
                </div>
            </div>

        </div>
        <div class="options">
            <div class="checkboxes">
                <div class="checkbox-1-div">
                    <input type="checkbox" class="checkbox-1">
                    <label for="checkbox-1">I want to receive news and special offers</label>
                </div>
                <div class="checkbox-2-div">
                    <input type="checkbox" class="checkbox-2">
                    <label for="checkbox-2">I agree with the Terms and Conditions</label>
                </div>
            </div>
            <hr>
            <div class="button">
                <input type="submit" value="SUBMIT">
            </div>
        </div>
    </div>
</body>

</html>
