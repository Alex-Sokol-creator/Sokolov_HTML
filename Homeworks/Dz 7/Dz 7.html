<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework 7</title>
    <style>
        body{
            background-color: rgb(238, 238, 238);
        }

        *{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: medium;
        }

        .blocks{
            text-align: center;
            background-color: white;
            width: 260px;
            height: auto;
            position: fixed;
            top: 100px;
            left: 100px;
            border: 1px solid rgb(143, 142, 142);
            border-radius: 12px;
            box-shadow: 0 0 15px rgb(122, 122, 122);
        }

        /* .blocks div{
            margin: auto;
        } */

        .blocks p:not(.per-month){
            color: black;
            font-weight: bold;
        }

        /* .blocks p:nth-of-type(1){
            text-transform: uppercase;
            font-size: large;
        }

        .blocks p:nth-of-type(2){
            font-size: x-large;
        }

        .blocks p:nth-of-type(3){
            font-size: large;
            color: rgb(235, 235, 235);
        }       */
        
        .topic{
            text-transform: uppercase;
            font-size: large;
        }

        .price{
            font-size: xx-large;
            margin-bottom: 2px;
        }

        .per-month{
            font-size: large;
            color: rgba(194, 189, 189, 0.651);
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .buttons{
           text-align: center;
           text-transform: uppercase;
           width: 100px;
           padding: 2px;
           margin: 25px auto;
           margin-top: 35px;
           border-radius: 8px;
        }

        .blocks .buttons p{
            color: white;
            margin: 10px 0;
            font-weight: 400;
        }

        #red-block .buttons{
            background-color: rgb(211, 29, 75);
        }

        hr{
            height: 4px;
        }

        #red-block hr{
            background-color: rgb(190, 26, 67);
        }
    </style>
</head>
<body>
    <div id="list-of-divs">
        <div class="blocks" id="red-block">
            <p class="topic">Enterprise</p>
            <hr>
            <p class="price">$69</p>
            <p class="per-month">per month</p>
            <div>
                <p>10GB disk place</p>
                <p>100GB monthly bandwidth</p>
                <p>20 email accounts</p>
                <p>Unlimited subdomens</p>
            </div>
            <div class="buttons">
                <p>Buy</p>
            </div>
        </div>
    </div>
</body>
</html>
