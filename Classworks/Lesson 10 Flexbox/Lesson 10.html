<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 10: Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        img {
            width: 200px;
            box-shadow: 2px 2px 15px black;
        }

        .container {
            background-color: coral;
            border: 1px solid cadetblue;
            border-radius: 15px;
            margin: 2em;
            padding: 1.5em;
            height: 500px;

            display: flex;
            /* flex-direction: column; */
            /* flex-direction: row-reverse; */
            /* flex-direction: column-reverse; */
            flex-direction: row;

            gap: 1.5em;
            /*Отступы между элементами, как padding (на подобии) */

            flex-wrap: wrap;

            justify-content: space-evenly;/*Как элементы будут отображаться, по линии */
            align-items: center;/*Доп линия для отображения, работает вместе с justify-content (предположительно)*/
        }

        .container .flex-elem{
            width: 180px;
            height: 180px;
            flex-wrap: nowrap;
            flex-basis: 100px; /*Размеры элемента, либо ширина, либо высота, в зависимости от других параметров*/

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 10px;
        }

        .elem1{
            background-color: green;
            flex-grow: 1;
            /* flex-shrink: 1; */
            /* order: 3; */
        }

        .elem2{
            background-color: blue;
            /* flex-grow: 2; */
            flex-shrink: 1;
            /* order: 4; */
            align-self: flex-start;
        }

        .elem3{
            background-color: yellow;
            flex-grow: 2;
            /* flex-shrink: 1; */
            /* order: 2; */
        }

        .elem4{
            background-color: red;
            flex-grow: 1;
            /* flex-shrink: 1; */
            /* order: 1; */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="flex-elem elem1">1</div>
        <div class="flex-elem elem2">2</div>
        <div class="flex-elem elem3">3</div>
        <div class="flex-elem elem4">4</div>
        <!-- <img src="../../Shared_Resources/Catnap.png" alt="Catnap"> -->
        <!-- <img src="../../Shared_Resources/Catnap.png" alt="Catnap">
        <img src="../../Shared_Resources/Catnap.png" alt="Catnap"> -->
    </div>
</body>

</html>
