<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 12: Grid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .grid-container {
            width: 80vw;
            margin: 1.3em auto;
            padding: 1.1em;
            background-color: cadetblue;

            display: grid;
            /* grid-template-columns: auto auto auto; Три столбика с одинаковой шириной */
            /* grid-template-columns: auto auto auto auto; Четыре столбика */
            /* grid-template-columns: 100px 30vw 35% 4em; */
            /* grid-template-columns: 1fr 2fr 1fr 3fr; Столбики делятся на части(1 часть первому, 2 части второй и тд.) */
            /* grid-template-columns: 100px 3em 1fr 30% 2fr; (width - 100px - 3m - 30%) / 3 */
            grid-template-columns: repeat(4, 1fr);
            /*Четыре столбика одинаковой ширины*/
            /* grid-template-rows: 100px 30vh; */
            /* column-gap: 1.1em;
            row-gap: 0.3em; */
            gap: 0.9em 1.1em;
            /*1-row gap 2-column gap*/
        }

        .grid-container div:nth-child(1) {
            /* grid-column-start: 1;
            grid-column-end: 4; */
            /* grid-column: 1 / span 3;
            grid-row: 1 / span 2; */
            /*grid-area: row-start / column-start / row-end / column-end*/
            grid-area: 1 / 1 / 3 / 4;
        }

        .grid-container div:nth-child(2) {
            grid-area: 1 / 4 / 5 / 5;
        }

        .grid-container div {
            width: 100%;
            height: auto;
            background-color: beige;
            border: darkslategray solid 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 100vw;
            padding: 0.6em;
            box-sizing: border-box;
            min-height: 100vh;

            display: grid;
            grid-template-columns: 1fr 3fr 2fr;
            grid-template-rows: 10vh 1fr 5vh;
            grid-template-areas:
                'header header header'
                'menu main right'
                'footer footer footer';
        }

        .container div {
            background-color: beige;
            border: cadetblue solid 2px;
        }

        .header {
            grid-area: header;
            display: flex;
            gap: 0.4em;
            align-items: center;

            padding: 0.2em;
            padding-left: 0.7em;
            padding-right: 0.7em;
        }

        .header div {
            border: none;
            text-transform: uppercase;
            font-family: Arial, Helvetica, sans-serif;
            transition: all 0.5s ease 0s;
        }

        .header div:hover{
            text-shadow: 2px 2px 15px black;
        }

        .header div:nth-child(3){
            margin-left: auto;
        }

        .menu {
            grid-area: menu;
        }

        .main {
            grid-area: main;
        }

        .right {
            grid-area: right;
        }

        .footer {
            grid-area: footer;
        }
    </style>
</head>

<body>
