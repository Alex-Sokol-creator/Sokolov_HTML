<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float-div</title>
    <style>
        div{
            float: left;
            padding: 15px;
        }
        .div-1{
            background-color: red;
        }
        .div-2{
            background-color: yellow;
        }
        .div-3{
            background-color: green;
        }
    </style>
</head>
<body>
    <h2>Float to each other</h2>

    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quos et maxime adipisci.</p>

    <div class="div-1">Div 1</div>
    <div class="div-2">Div 2</div>
    <div class="div-3">Div 3</div>
</body>
</html>
