<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 from Homework 10</title>
    <style>
        body {
            background-color: #014242;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 60px;
        }

        .path {
            margin: 30px 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 5px;
            color: rgb(194, 191, 191);
        }

        .main-text {
            margin: 30px 0;
            margin-bottom: 40px;
            width: 520px;
            color: whitesmoke;
            font-size: 45px;
            font-weight: bold;
        }

        .footer {
            margin: 30px 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 30px;
        }

        .footer-divs{
            display: flex;
            justify-items: flex-start;
            align-items: center;
            gap: 30px;
        }

        .footer-divs p {
            margin: 0;
        }

        .footer-divs p:first-child {
            color: rgb(156, 156, 156);
        }

        .footer-divs p:nth-child(2) {
            color: whitesmoke;
        }

        .footer img {
            width: 70px;
        }

        @media screen and (max-width:600px) {
            .path{
                margin: 5px 0;
            }

            .main-text {
                margin: 10px 0;
                margin-bottom: 15px;
                font-size: 25px;
                width: 290px;
            }

            .footer{
                margin: 5px 0;
                gap: 40px;
            }

            .footer-divs {
                display: grid;
                grid-template-columns: repeat(2,1fr);
            }

            .Author{
                grid-area: 1 / 2 / 1 / 3;
            }

            .Published{
                grid-area: 2 / 2 / 2 / 3;
            }

            .Updated{
                grid-area: 1 / 1 / 1 / 2;
            }
        }
    </style>
</head>

<body>
    <div class="path">
        <div>
            Home
        </div>
        <div>
            /
        </div>
        <div>
            Articles
        </div>
        <div>
            /
        </div>
    </div>
    <div class="main-text">
        The Difference Between Responsive and Adaptive Design
    </div>
    <div class="footer">
        <img src="../../Homeworks/Dz 10/Images/account.png" alt="account-logo">
        <div class="footer-divs">
            <div class="Author">
                <p>Author</p>
                <p>Geoff Graham</p>
            </div>
            <div class="Comments">
                <p>49 Comments</p>
                <p>Go to comments</p>
            </div>
            <div class="Published">
                <p>Published</p>
                <p>Nov 11, 2018</p>
            </div>
            <div class="Updated">
                <p>Updated</p>
                <p>Nov 17, 2018</p>
            </div>
        </div>

    </div>
</body>

</html>
