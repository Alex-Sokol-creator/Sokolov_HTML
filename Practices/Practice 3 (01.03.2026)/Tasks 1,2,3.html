<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks 1, 2 and 3 from Practice 3</title>
    <style>
        body {
            background-color: aliceblue;
            box-sizing: border-box;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .border-bar {
            margin: 15px;
            width: 250px;
            height: auto;
            border: 4px solid orange;
        }

        .download-bar {
            width: 50px;
            height: 50px;
            background-color: orange;
            /* transition: all 0.8s ease 0s; */
            animation: download-bar-anim;
            animation-duration: 3s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            /* animation-direction: alternate; */
        }

        @keyframes download-bar-anim {

            /* 0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(200px, 0);
            }

            100% {
                transform: translate(0,0);
            } */
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(200px, 0);
            }

        }

        #heart {
            width: 100px;
            height: auto;
            filter: grayscale(100%);
            margin: 0 200px;
            transition: all 5s ease 0s;
        }

        #heart:hover {
            filter: grayscale(0%);
            width: 400px;
            height: auto;
            transform: translate(-140px, -80px);
            margin-bottom: 50px;
        }

        #greeting {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            font-size: x-large;
        }

        #img-to-rotate {
            position: relative;
        }

        .rot-img {
            width: 90px;
            height: auto;
            position: absolute;
            left: 50%;
            top: 200px;
            /* transform: translate(-50%, 0); */
        }

        .rot-img-big{
            width: 130px;
            height: auto;
        }

        #calc {
            z-index: 1;
            animation: calc-anim;
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-iteration-count: 1;
            animation-delay: 0s;
            animation-fill-mode: forwards;
        }

        @keyframes calc-anim {
            from{
                transform: translate(0,0);
            }
            to{
                /* transform: translate(-300px, 0); */
                transform: rotate(-30deg);
                transform-origin: -300% 550%;
            }
        }

        #book {
            z-index: 0.9;
            animation: book-anim;
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-iteration-count: 1;
            animation-delay: 0.5s;
            animation-fill-mode: forwards;
        }

        @keyframes book-anim {
            from{
                transform: translate(0,0);
            }
            to{
                /* transform: translate(-300px, 0); */
                transform: rotate(-17deg);
                transform-origin: -450% 355%;
            }
        }

        #paper {
            z-index: 0.8;
            animation: paper-anim;
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-iteration-count: 1;
            animation-delay: 1s;
            animation-fill-mode: forwards;
        }

        @keyframes paper-anim {
            from{
                transform: translate(0,0);
            }
            to{
                /* transform: translate(-300px, 0); */
                transform: rotate(17deg);
                transform-origin: 500% 30%;
            }
        }

        #pallete {
            z-index: 0.7;
            animation: pallete-anim;
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-iteration-count: 1;
            animation-delay: 1.5s;
            animation-fill-mode: forwards;
        }

        @keyframes pallete-anim {
            from{
                transform: translate(0,0);
            }
            to{
                transform: rotate(30deg);
                transform-origin: 350% 340%;
            }

            /* from{
                transform: translate(0,0);
                transform: scale(-1);
            }
            to{
                transform: rotate(30deg);
                transform: scale(-1);
                transform: translate(200px,-100px);
            } */
        }

        #pencil {
            z-index: 0.7;
            animation: pencil-anim;
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-iteration-count: 1;
            animation-delay: 2s;
            animation-fill-mode: forwards;
        }

        @keyframes pencil-anim {
            from{
                transform: translate(0,0);
            }
            to{
                /* transform: translate(-300px, 0); */
                transform: rotate(90deg);
                transform-origin: 30% 20%;
            }
        }
    </style>
</head>

<body>
    <h1>Задание 1</h1>
    <div class="border-bar">
        <div class="download-bar"></div>
    </div>

    <h1>Задание 2</h1>
    <img id="heart" src="Images/favorites.png" alt="A heart">

    <h1>Задание 3</h1>
    <div>
        <p id="greeting">Hello, my site!</p>
        <div id="img-to-rotate">
            <img class="rot-img" id="calc" src="Images/calc.png" alt="calculator">
            <img class="rot-img rot-img-big" id="book" src="Images/book.png" alt="book">
            <img class="rot-img rot-img-big" id="paper" src="Images/paper.png" alt="paper-list">
            <img class="rot-img" id="pallete" src="Images/pallete.png" alt="color pallet">
            <img class="rot-img" id="pencil" src="Images/pencil.png" alt="pencil">
        </div>
    </div>
</body>

</html>
